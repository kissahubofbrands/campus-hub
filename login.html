<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-container">

    <div class="login-brand">
        <div class="brand-icon">🎓</div>
        <h1>CampusConnect</h1>
        <p>One platform. Every college update.</p>
    </div>

    <div class="login-card">

        <h2>Welcome Back</h2>
        <p class="login-subtitle">Sign in to access your campus information</p>

        <label>Email / Student ID</label>
        <input type="text" id="email" placeholder="Enter your ID or email">

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password">

        <label>Login as</label>

        <select id="role">
            <option value="student">Student</option>
            <option value="admin">Management / Admin</option>
        </select>

        <button class="primary-btn" onclick="login()">
            Sign In
        </button>

        <p id="login-message" class="login-message"></p>

    </div>

    <p class="copyright">
        © 2026 CampusConnect • College Communication Hub
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
